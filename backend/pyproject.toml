[project]
name = "movie-log-backend"
version = "1.1.9"
description = "movie logger - extract movie and theatre details from movie ticket"
readme = "README.md"
requires-python = ">=3.11.4"
dependencies = [
    "cryptography>=49.0.0",
    "fastapi==0.141.1",
    "gunicorn==23.0.0",
    "httpx>=0.28.1",
    "loguru==0.7.3",
    "openai==1.96.0",
    "pillow>=11.3.0",
    "pipdeptree==2.27.0",
    "playwright>=1.62.0",
    "pydantic-settings[yaml]>=2.10.1",
    "pyjwt[crypto]>=2.10.1",
    "python-dotenv==1.1.1",
    "python-magic>=0.4.27",
    "python-multipart==0.0.32",
    "requests>=2.32.4",
    "setuptools==65.5.0",
    "slowapi>=0.1.9",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pre-commit-hooks>=5.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `-m "not llm and not external"`: excludes @pytest.mark.llm and
# @pytest.mark.external tests by default (see below) — without this,
# `uv run pytest` with no -m flag runs *everything*, markers alone only
# make `-m llm`/`-m "not llm"` etc. available, they don't change the
# default selection. Pass `-m llm`, `-m external`, or `-m "llm or external"`
# (each overrides addopts) to run those specifically, or `-m ""` to run
# literally everything.
addopts = "-m \"not llm and not external\""
# `llm`: makes a real call to an LLM provider (OpenRouter/OpenAI/Gemini)
# with a personal test key — opt-in via `-m llm`, never run by default.
# Burning through Gemini's 5 RPM free tier or real OpenAI cost on every
# default run isn't acceptable; see tests/README.md.
# `external`: makes a real call to a real, billed third-party API (Google
# Places) with the backend's own configured key — opt-in via `-m external`,
# same reasoning as `llm`. TMDB is NOT under this marker: it's genuinely
# free with no billing risk, so real TMDB calls run by default.
# `slow`: multi-step flows (e.g. the full key-rotation lifecycle) that are
# fine to include by default but worth being able to skip with `-m "not slow"`
# for a fast inner loop.
markers = [
    "llm: makes a real call to an LLM provider with a personal test key (opt-in, see -m llm)",
    "external: makes a real call to a billed third-party API like Google Places (opt-in, see -m external)",
    "slow: a multi-step flow, still run by default but skippable with -m 'not slow'",
]
